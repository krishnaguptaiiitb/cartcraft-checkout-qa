name: CartCraft Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Playwright (Chromium)
    runs-on: ubuntu-latest
    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium

      - name: Typecheck and production build
        run: npm run build

      - name: Run all browser tests with deterministic CI settings
        run: npm run test:e2e -- --project=chromium --workers=1 --retries=0

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cartcraft-playwright-html
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload JUnit and failure traces
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cartcraft-playwright-raw-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
